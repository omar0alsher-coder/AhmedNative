name: Build Native APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Force system to use Python 3.9
        run: |
          sudo update-alternatives --install /usr/bin/python3 python3 $(which python3.9) 1
          sudo update-alternatives --set python3 $(which python3.9)
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev automake libltdl-dev

      - name: Install buildozer and dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install buildozer "cython<3.0" virtualenv

      - name: Build APK
        run: |
          export BUILDOZER_WARN_ON_ROOT=1
          buildozer -v android debug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ahmed-native-apk
          path: bin/*.apk
          if-no-files-found: warn
